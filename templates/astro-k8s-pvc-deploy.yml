name: Deploy Astro via Infra Reusable Workflow

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    uses: Genopsys-io/infra-cicd/.github/workflows/astro-k8s-pvc-reusable.yml@v2
    with:
      node_version: "22"
      build_dir: dist
      k8s_namespace: ${{ vars.K8S_NAMESPACE }}
      k8s_pod_label: ${{ vars.K8S_POD_LABEL }}
      k8s_container: ${{ vars.K8S_CONTAINER }}
      deploy_root: ${{ format('/usr/share/nginx/html/{0}', vars.ASTRO_SITE_ID) }}
      releases_to_keep: ${{ vars.RELEASES_TO_KEEP || '5' }}
      gke_location: ${{ vars.GKE_LOCATION }}
      gke_cluster_name: ${{ vars.GKE_CLUSTER_NAME }}
      gcp_service_account_email: ${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}
      gcp_workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
name: Reusable Astro Deploy to Kubernetes PVC

on:
  workflow_call:
    inputs:
      auth_mode:
        description: Authentication mode (kubeconfig or oidc)
        required: false
        type: string
        default: kubeconfig
      node_version:
        description: Node.js version used for build
        required: false
        type: string
        default: "22"
      build_dir:
        description: Astro build output directory
        required: false
        type: string
        default: dist
      k8s_namespace:
        description: Kubernetes namespace containing target pod
        required: true
        type: string
      k8s_pod_label:
        description: Label selector to locate target pod
        required: true
        type: string
      k8s_container:
        description: Container name running nginx
        required: true
        type: string
      deploy_root:
        description: Root path on mounted PVC for this site
        required: true
        type: string
      healthcheck_url:
        description: URL checked after deployment
        required: true
        type: string
      releases_to_keep:
        description: Number of releases retained on PVC
        required: false
        type: string
        default: "5"
      gke_location:
        description: GKE cluster location (required when auth_mode=oidc)
        required: false
        type: string
        default: ""
      gke_cluster_name:
        description: GKE cluster name (required when auth_mode=oidc)
        required: false
        type: string
        default: ""
      gcp_service_account_email:
        description: GCP service account email (required when auth_mode=oidc)
        required: false
        type: string
        default: ""
      gcp_workload_identity_provider:
        description: GCP workload identity provider resource ID (required when auth_mode=oidc)
        required: false
        type: string
        default: ""
    secrets:
      kube_config_data:
        description: Base64-encoded kubeconfig
        required: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Astro
        run: npm run build

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Validate auth configuration
        shell: bash
        env:
          AUTH_MODE: ${{ inputs.auth_mode }}
          KUBE_CONFIG_DATA: ${{ secrets.kube_config_data }}
          GKE_LOCATION: ${{ inputs.gke_location }}
          GKE_CLUSTER_NAME: ${{ inputs.gke_cluster_name }}
          GCP_SERVICE_ACCOUNT_EMAIL: ${{ inputs.gcp_service_account_email }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ inputs.gcp_workload_identity_provider }}
        run: |
          set -euo pipefail

          case "$AUTH_MODE" in
            kubeconfig)
              if [ -z "$KUBE_CONFIG_DATA" ]; then
                echo "kube_config_data secret is required when auth_mode=kubeconfig"
                exit 1
              fi
              ;;
            oidc)
              missing=0
              for v in GKE_LOCATION GKE_CLUSTER_NAME GCP_SERVICE_ACCOUNT_EMAIL GCP_WORKLOAD_IDENTITY_PROVIDER; do
                if [ -z "${!v:-}" ]; then
                  echo "Missing required input for OIDC mode: $v"
                  missing=1
                fi
              done
              if [ "$missing" -ne 0 ]; then
                exit 1
              fi
              ;;
            *)
              echo "Unsupported auth_mode: $AUTH_MODE"
              exit 1
              ;;
          esac

      - name: Auth GCP (OIDC)
        if: ${{ inputs.auth_mode == 'oidc' }}
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ inputs.gcp_workload_identity_provider }}
          service_account: ${{ inputs.gcp_service_account_email }}

      - name: Setup gcloud (OIDC)
        if: ${{ inputs.auth_mode == 'oidc' }}
        uses: google-github-actions/setup-gcloud@v3

      - name: Get GKE credentials (OIDC)
        if: ${{ inputs.auth_mode == 'oidc' }}
        uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: ${{ inputs.gke_cluster_name }}
          location: ${{ inputs.gke_location }}

      - name: Write kubeconfig (kubeconfig mode)
        if: ${{ inputs.auth_mode == 'kubeconfig' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.kube_config_data }}" | base64 --decode > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Deploy to PVC with atomic symlink and rollback
        shell: bash
        env:
          BUILD_DIR: ${{ inputs.build_dir }}
          K8S_NAMESPACE: ${{ inputs.k8s_namespace }}
          K8S_POD_LABEL: ${{ inputs.k8s_pod_label }}
          K8S_CONTAINER: ${{ inputs.k8s_container }}
          DEPLOY_ROOT: ${{ inputs.deploy_root }}
          HEALTHCHECK_URL: ${{ inputs.healthcheck_url }}
          RELEASES_TO_KEEP: ${{ inputs.releases_to_keep }}
        run: |
          set -euo pipefail

          BUILD_SHA="${GITHUB_SHA::12}"
          RELEASES_DIR="$DEPLOY_ROOT/releases"
          RELEASE_DIR="$RELEASES_DIR/$BUILD_SHA"
          CURRENT_LINK="$DEPLOY_ROOT/current"

          POD_NAME="$(kubectl get pod -n "$K8S_NAMESPACE" -l "$K8S_POD_LABEL" -o jsonpath='{.items[0].metadata.name}')"
          if [ -z "$POD_NAME" ]; then
            echo "No pod found for label: $K8S_POD_LABEL"
            exit 1
          fi

          echo "Deploying commit $BUILD_SHA to pod $POD_NAME"

          kubectl exec -n "$K8S_NAMESPACE" "$POD_NAME" -c "$K8S_CONTAINER" -- sh -lc "mkdir -p '$RELEASE_DIR' '$RELEASES_DIR' '$DEPLOY_ROOT'"

          tar -C "$BUILD_DIR" -czf - . | kubectl exec -i -n "$K8S_NAMESPACE" "$POD_NAME" -c "$K8S_CONTAINER" -- sh -lc "tar -xzf - -C '$RELEASE_DIR'"

          PREVIOUS_TARGET=""
          if kubectl exec -n "$K8S_NAMESPACE" "$POD_NAME" -c "$K8S_CONTAINER" -- sh -lc "[ -L '$CURRENT_LINK' ]"; then
            PREVIOUS_TARGET="$(kubectl exec -n "$K8S_NAMESPACE" "$POD_NAME" -c "$K8S_CONTAINER" -- sh -lc "readlink '$CURRENT_LINK'")"
          fi

          kubectl exec -n "$K8S_NAMESPACE" "$POD_NAME" -c "$K8S_CONTAINER" -- sh -lc "ln -sfn '$RELEASE_DIR' '$CURRENT_LINK'"
          kubectl exec -n "$K8S_NAMESPACE" "$POD_NAME" -c "$K8S_CONTAINER" -- sh -lc "nginx -t && nginx -s reload"

          set +e
          HTTP_CODE="$(curl -k -sS -o /dev/null -w '%{http_code}' --retry 6 --retry-delay 3 --retry-connrefused "$HEALTHCHECK_URL")"
          set -e

          if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "301" ] && [ "$HTTP_CODE" != "302" ]; then
            echo "Healthcheck failed ($HTTP_CODE), starting rollback"
            if [ -n "$PREVIOUS_TARGET" ]; then
              kubectl exec -n "$K8S_NAMESPACE" "$POD_NAME" -c "$K8S_CONTAINER" -- sh -lc "ln -sfn '$PREVIOUS_TARGET' '$CURRENT_LINK' && nginx -t && nginx -s reload"
              echo "Rollback done to $PREVIOUS_TARGET"
            else
              echo "No previous release found for rollback"
            fi
            exit 1
          fi

          echo "Healthcheck passed ($HTTP_CODE)"

          kubectl exec -n "$K8S_NAMESPACE" "$POD_NAME" -c "$K8S_CONTAINER" -- sh -lc "ls -1dt '$RELEASES_DIR'/* 2>/dev/null | sed -e '1,${RELEASES_TO_KEEP}d' | xargs -r rm -rf"
          echo "Cleanup done (kept $RELEASES_TO_KEEP releases)"
